[package]
name = "qwen-image-rs"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Rust CUDA inference for Qwen-Image-2.1 (candle spine, 4090-tuned)"
repository = "local"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
safetensors = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-flash-attn = { version = "0.11", optional = true }
half = { version = "2", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
# CUDA path — only builds on the WSL 4090 host (needs CUDA toolkit + a GPU).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# cuDNN conv2d for the VAE (tensor-core math; src/cudnn_conv.rs). Needs libcudnn
# (pip wheel nvidia-cudnn-cu13, see scripts/setup-host.sh; QIR_CUDNN_LIB).
cudnn = ["cuda", "candle-core/cudnn", "dep:half"]
# FlashAttention-2 kernels (Ada/Ampere/Hopper only). ~19 min first build.
flash-attn = ["cuda", "dep:candle-flash-attn"]
# ConvRot INT8 W8A8: compiles kernels/convrot/*.cu (needs CUTLASS_DIR).
convrot = ["cuda", "dep:cc", "dep:half"]
# SageAttention INT8-QK / FP16-PV attention: compiles vendored kernels/sage/*.cu.
sage = ["cuda", "dep:cc", "dep:half"]
# SageAttention2 (sm89): INT8-QK per-thread + K smoothing, FP8-PV. Adds
# kernels/sage/sage2_ffi.cu; runtime QIR_SAGE=1|2|2f32 picks v1 / SA2 (default 2).
sage2 = ["sage"]
# Fused LayerNorm+AdaLN kernel: compiles kernels/fusednorm/*.cu.
fusednorm = ["cuda", "dep:cc", "dep:half"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
