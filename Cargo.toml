[package]
name = "qwen-image-rs"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Rust CUDA inference for Qwen-Image-2.1 (candle spine, 4090-tuned)"
repository = "local"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
safetensors = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# CUDA path — only builds on the WSL 4090 host (needs CUDA toolkit + a GPU).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
# FlashAttention-2 kernels (Ada/Ampere/Hopper only).
flash-attn = ["cuda", "candle-transformers/flash-attn"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
